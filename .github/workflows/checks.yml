name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: vaschub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaschub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaschub -d vaschub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://vaschub:ci-only-password@localhost:5432/vaschub_test
      PAYLOAD_SECRET: ci-only-placeholder-never-for-production
      PREVIEW_SECRET: ci-only-preview-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_SERVER_COMMAND: pnpm start
      - name: Verify Docker build
        run: docker compose build app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
