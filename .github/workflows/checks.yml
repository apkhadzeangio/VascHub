name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: vaschub
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaschub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaschub -d vaschub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://vaschub:ci-only-password@localhost:5432/vaschub_test
      PAYLOAD_SECRET: ci-only-placeholder-never-for-production
      PREVIEW_SECRET: ci-only-preview-placeholder
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:int
      - run: pnpm payload run scripts/check-library-migration.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_SERVER_COMMAND: pnpm start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: |
            test-results/homepage/
            test-results/library/
          if-no-files-found: warn
      - name: Verify Docker build and startup
        env:
          POSTGRES_DB: vaschub_docker_test
          ADMIN_EMAIL: docker-admin@vaschub.test
          ADMIN_PASSWORD: ci-only-docker-bootstrap-password-123
        run: |
          cp .env.example .env
          docker compose build app
          docker compose up -d
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://127.0.0.1:3000/ -o /dev/null
          docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD app pnpm admin:create
          docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD app node tests/http/smoke.mjs
          docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD app node tests/http/library-persistence.mjs prepare
          docker compose restart app
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail http://127.0.0.1:3000/ -o /dev/null
          docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD app node tests/http/smoke.mjs
          docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD app node tests/http/library-persistence.mjs verify
      - name: Stop Compose services
        if: always()
        run: |
          if [ -f .env ]; then docker compose down -v; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  directory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: vaschub
          POSTGRES_PASSWORD: ci-only-directory-password
          POSTGRES_DB: vaschub_directory_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vaschub -d vaschub_directory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://vaschub:ci-only-directory-password@localhost:5432/vaschub_directory_test
      PAYLOAD_SECRET: ci-only-directory-secret-never-for-production
      PREVIEW_SECRET: ci-only-directory-preview
      NEXT_PUBLIC_SERVER_URL: http://localhost:3105
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Preserve existing data through upgrade, rollback and reapply
        run: pnpm payload run tests/int/directory/check-migration.ts
      - run: pnpm exec vitest run --config tests/int/directory/vitest.config.mts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production directory browser tests
        run: pnpm exec cross-env 'NODE_OPTIONS=--no-deprecation --import=tsx/esm' playwright test --config tests/e2e/directory/playwright.config.ts
        env:
          DIRECTORY_SERVER_COMMAND: pnpm start --hostname 127.0.0.1 --port 3105
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-previews
          path: |
            docs/directory/screenshots/
            test-results/directory/
            test-results/directory-results.json
          if-no-files-found: warn
