services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaschub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaschub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaschub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vaschub}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      MEDIA_DIR: /app/media-data
      LIBRARY_FILES_DIR: /app/media-data/library-private
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - media_data:/app/media-data
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate && exec pnpm start --hostname 0.0.0.0"]
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
